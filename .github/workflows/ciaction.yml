name: use docker action
on:
    workflow_dispatch:



jobs:
    hypredJob:
        runs-on: ubuntu-latest
        steps:
            - name: print job and workflow name
              run: echo "From job name"
              
            - name: print from docker
              uses: docker://alpine:3.17
              with:
                entrypoint: /bin/sh
                args: -c "echo 'From docker image'"

    dockerized_job:
        needs: hypredJob
        runs-on: ubuntu-latest
        container:
            image: node:23
        steps:
            - name: node version
              run: node -v
            - name: print job and workflow name
              run: echo "From job name"
