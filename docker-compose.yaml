
services:
  node-app:
    container_name: "testapp1"
    image: muhammed8016/newapp
    build: .
    
    env_file:
      - .env
    depends_on:
      - db

    deploy:
      mode: replicated       # 'replicated' (fixed number) or 'global' (one per node)
      replicas: 4            # Total instances running across the cluster

      placement:
        max_replicas_per_node: 1

      update_config:
        parallelism: 2       # Number of containers to update at a time
        delay: 10s           # Time to wait between updating container groups
        order: start-first   # Rolling update strategy: 'start-first' or 'stop-first'
        failure_action: rollback # What to do if the update fails

      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  web:
    container_name: web
    build:
      context: nginx/.
    ports:
    - "8080:80"
    depends_on:
      - node-app


  db:
    image: postgres
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: example
    volumes:
      - postgres_data:/var/lib/postgresql

  adminer:
    image: adminer
    restart: always
    ports:
      - 8085:8080

