<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Node.js MongoDB CRUD</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <div class="container">

    <h1>
      Node.js + MongoDB CRUD
    </h1>


    <!-- Add Product -->

    <div class="card">

      <h2>Add Product</h2>

      <form id="productForm">

        <input
          type="text"
          id="name"
          placeholder="Product Name"
          required
        >

        <input
          type="number"
          id="price"
          placeholder="Price"
          min="0"
          required
        >

        <input
          type="number"
          id="quantity"
          placeholder="Quantity"
          min="0"
          required
        >

        <button
          type="submit"
          class="add-btn"
        >
          Add Product
        </button>

      </form>

    </div>


    <!-- Status -->

    <div
      id="status"
      class="status"
    >
      Loading products...
    </div>


    <!-- Products -->

    <div class="card">

      <h2>Products</h2>

      <table>

        <thead>

          <tr>

            <th>Name</th>

            <th>Price</th>

            <th>Quantity</th>

            <th>Actions</th>

          </tr>

        </thead>


        <tbody id="productsTable">

        </tbody>

      </table>

    </div>

  </div>


  <script src="script.js"></script>

</body>

</html>
